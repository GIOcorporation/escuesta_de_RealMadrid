<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Madrid Quiz · 20 preguntas · 3 minutos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b1a2e;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo con las imágenes proporcionadas */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png'), 
                        url('https://e00-marca.uecdn.es/assets/multimedia/imagenes/2024/06/02/17172888031015.jpg');
      background-size: cover, cover;
      background-position: center, center;
      background-repeat: no-repeat, no-repeat;
      opacity: 0.15;
      z-index: -2;
      filter: blur(2px);
    }

    /* Capa oscura para mejorar legibilidad */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #0b1a2e 0%, #1b3a5c 100%);
      opacity: 0.85;
      z-index: -1;
    }

    .card {
      max-width: 820px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
      padding: 30px 35px;
      color: #fff;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(to right, #f9e79f, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .subhead {
      text-align: center;
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 15px;
      font-weight: 300;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }

    .timer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 18px;
      border-radius: 60px;
      margin-bottom: 18px;
      font-weight: 600;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 215, 0, 0.4);
    }

    .timer {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f1c40f;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #f1c40f80;
      transition: color 0.3s;
    }

    .timer.danger {
      color: #e74c3c;
      text-shadow: 0 0 15px #e74c3c;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .progress {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .score-live {
      background: #f1c40f;
      color: #0a1a2a;
      padding: 6px 16px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 25px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
      min-height: 4rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 100px;
      padding: 15px 22px;
      font-size: 1.1rem;
      color: #f0f0f0;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
      border-color: #f1c40f;
      transform: scale(1.01);
      box-shadow: 0 10px 18px -6px rgba(0, 0, 0, 0.6);
    }

    .option-btn.selected-correct {
      background: #2ecc71;
      border-color: #2ecc71;
      color: #0b1a2e;
      font-weight: 700;
      box-shadow: 0 0 20px #2ecc7180;
    }

    .option-btn.selected-wrong {
      background: #e74c3c;
      border-color: #e74c3c;
      color: white;
      font-weight: 700;
      box-shadow: 0 0 20px #e74c3c80;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option-btn.selected-correct:disabled,
    .option-btn.selected-wrong:disabled {
      opacity: 1;
    }

    .feedback {
      min-height: 50px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      margin-bottom: 15px;
      font-weight: 500;
      backdrop-filter: blur(5px);
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .feedback.correct-fb {
      background: #2ecc7130;
      border-left: 8px solid #2ecc71;
      color: #d5f5e3;
    }

    .feedback.wrong-fb {
      background: #e74c3c30;
      border-left: 8px solid #e74c3c;
      color: #fadbd8;
    }

    .actions {
      display: flex;
      gap: 15px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .btn {
      padding: 15px 30px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      background: white;
      color: #0b1a2e;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      letter-spacing: 0.3px;
      flex: 1;
      min-width: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px -6px black;
      background: #f1c40f;
      color: #0a1a2a;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      box-shadow: none;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      border-color: #f1c40f;
      color: #f1c40f;
    }

    .result-area {
      margin-top: 20px;
      padding: 25px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 40px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid #f1c40f50;
    }

    .final-score {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      background: linear-gradient(to right, #f9e79f, #f1c40f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 10px 0;
    }

    .final-message {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #dfe6e9;
    }

    .restart-btn {
      max-width: 280px;
      margin: 0 auto;
      background: #f1c40f;
      color: #0b1a2e;
      border: none;
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }

    .badge {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 10px;
      border-radius: 30px;
      margin-left: 12px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 20px;
      }
      .question-text {
        font-size: 1.2rem;
      }
      .option-btn {
        font-size: 0.95rem;
        padding: 12px 16px;
      }
      .final-score {
        font-size: 2.8rem;
      }
      .timer {
        font-size: 1.2rem;
      }
      .timer-bar {
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <h1>⚽ REAL MADRID QUIZ</h1>
    <div class="subhead">20 preguntas · 3 minutos · opciones aleatorias</div>

    <!-- Sección activa del cuestionario -->
    <div id="quizSection">

      <div class="question-text" id="questionText">Cargando...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackMsg">Selecciona una respuesta</div>
      <div class="actions">
        <button class="btn btn-secondary" id="restartBtn">🔄 Reiniciar</button>
      </div>
    </div>

    <!-- Sección de resultados finales -->
    <div id="resultSection" class="result-area hidden">
      <div style="font-size: 2rem; margin-bottom: 10px;">🏆</div>
      <div style="font-weight: 300; letter-spacing: 1px;">TU NOTA FINAL</div>
      <div class="final-score" id="finalScoreValue">0/20</div>
      <div class="final-message" id="finalMessage"></div>
      <button class="btn restart-btn" id="restartFromResult">🔄 Jugar de nuevo</button>
    </div>
  </div>

  <script>
    (function() {
      // ----------------------------------------------------------------
      // BANCO DE PREGUNTAS (50 preguntas extraídas de tu archivo)
      // ----------------------------------------------------------------
      const BANCO_PREGUNTAS = [
        { texto: "¿En qué año se fundó el Real Madrid?", correcta: "1902", incorrectas: ["1900", "1903", "1905"] },

        { texto: "¿Qué legendario jugador hispano-argentino marcó época en los años 50 y 60 con cinco Copas de Europa?", correcta: "Alfredo Di Stéfano", incorrectas: ["Ferenc Puskás", "Hugo Sánchez", "Zinedine Zidane"] },
        { texto: "¿Quién fue el entrenador que ganó tres Champions League consecutivas (2016, 2017 y 2018)?", correcta: "Zinedine Zidane", incorrectas: ["Carlo Ancelotti", "Vicente del Bosque", "José Mourinho"] },

      // UTILIDADES
      // ----------------------------------------------------------------
      function barajarArray(arr) {
        const copia = [...arr];
        for (let i = copia.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
      }

      // ----------------------------------------------------------------
      // SELECCIÓN ALEATORIA DE PREGUNTAS
      // ----------------------------------------------------------------
      function obtenerPreguntasAleatorias(cantidad) {
        const barajadas = barajarArray(BANCO_PREGUNTAS);
        const seleccionadas = barajadas.slice(0, cantidad);
        // Para cada pregunta, barajar sus opciones
        return seleccionadas.map(p => {
          const opciones = [p.correcta, ...p.incorrectas];
          return {
            texto: p.texto,
            correcta: p.correcta,
            opciones: barajarArray(opciones)
          };
        });
      }

      // ----------------------------------------------------------------
      // CRONÓMETRO
      // ----------------------------------------------------------------
      function iniciarTemporizador() {
        if (temporizador) clearInterval(temporizador);
        tiempoRestante = TIEMPO_INICIAL;
        actualizarTimerDisplay();

        temporizador = setInterval(() => {
          tiempoRestante--;
          actualizarTimerDisplay();

          if (tiempoRestante <= 0) {
            clearInterval(temporizador);
            temporizador = null;
            // Tiempo agotado: terminar juego
            finalizarJuegoPorTiempo();
          }
        }, 1000);
      }

      function actualizarTimerDisplay() {
        const minutos = Math.floor(tiempoRestante / 60);
        const segundos = tiempoRestante % 60;
        timerDisplay.textContent = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;

        if (tiempoRestante <= 30) {
          timerDisplay.classList.add('danger');
        } else {
          timerDisplay.classList.remove('danger');
        }
      }

      function detenerTemporizador() {
        if (temporizador) {
          clearInterval(temporizador);
          temporizador = null;
        }
      }

      // ----------------------------------------------------------------
      // LÓGICA DEL JUEGO
      // ----------------------------------------------------------------
      function reiniciarJuego() {
        detenerTemporizador();
        juegoTerminado = false;
        indicePregunta = 0;
        aciertos = 0;
        opcionSeleccionada = false;

        // Generar preguntas aleatorias
        preguntasSeleccionadas = obtenerPreguntasAleatorias(TOTAL_PREGUNTAS);

        // Mostrar sección de quiz, ocultar resultados
        quizSection.classList.remove('hidden');
        resultSection.classList.add('hidden');

        // Limpiar feedback
        feedbackMsg.textContent = 'Selecciona una respuesta';
        feedbackMsg.className = 'feedback';

        // Renderizar primera pregunta
        renderPreguntaActual();
        actualizarMarcadores();

        // Iniciar temporizador
        iniciarTemporizador();
      }

      function actualizarMarcadores() {
        progressDisplay.textContent = `Pregunta ${indicePregunta + 1} / ${TOTAL_PREGUNTAS}`;
        liveScoreDisplay.textContent = `✅ ${aciertos} acierto${aciertos !== 1 ? 's' : ''}`;
      }

      function renderPreguntaActual() {
        if (indicePregunta >= preguntasSeleccionadas.length) {
          mostrarResultadosFinales();
          return;
        }

        const pregunta = preguntasSeleccionadas[indicePregunta];
        questionText.textContent = pregunta.texto;

        opcionSeleccionada = false;
        feedbackMsg.textContent = 'Selecciona una respuesta';
        feedbackMsg.className = 'feedback';

        optionsContainer.innerHTML = '';
        pregunta.opciones.forEach(opcionTexto => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opcionTexto;
          btn.setAttribute('data-valor', opcionTexto);
          btn.addEventListener('click', (e) => manejarRespuesta(e, opcionTexto, pregunta.correcta));
          optionsContainer.appendChild(btn);
        });

        actualizarMarcadores();
      }

      function manejarRespuesta(event, opcionElegida, respuestaCorrecta) {
        if (opcionSeleccionada || juegoTerminado) return;

        const botonElegido = event.currentTarget;
        const todosLosBotones = Array.from(optionsContainer.querySelectorAll('.option-btn'));

        todosLosBotones.forEach(btn => btn.disabled = true);

        const esCorrecta = (opcionElegida === respuestaCorrecta);

        if (esCorrecta) {
          botonElegido.classList.add('selected-correct');
          aciertos++;
          feedbackMsg.textContent = '✅ ¡Correcto!';
          feedbackMsg.className = 'feedback correct-fb';
        } else {
          botonElegido.classList.add('selected-wrong');
          todosLosBotones.forEach(btn => {
            if (btn.getAttribute('data-valor') === respuestaCorrecta) {
              btn.classList.add('selected-correct');
            }
          });
          feedbackMsg.textContent = `❌ Incorrecto. La respuesta correcta era: ${respuestaCorrecta}`;
          feedbackMsg.className = 'feedback wrong-fb';
        }

        liveScoreDisplay.textContent = `✅ ${aciertos} acierto${aciertos !== 1 ? 's' : ''}`;
        opcionSeleccionada = true;

        // Avanzar después de un breve retraso
        setTimeout(() => {
          if (juegoTerminado) return; // Si el tiempo se agotó mientras esperábamos
          indicePregunta++;
          if (indicePregunta < preguntasSeleccionadas.length) {
            renderPreguntaActual();
            progressDisplay.textContent = `Pregunta ${indicePregunta + 1} / ${TOTAL_PREGUNTAS}`;
          } else {
            mostrarResultadosFinales();
          }
        }, 1200);
      }

      function finalizarJuegoPorTiempo() {
        if (juegoTerminado) return;
        juegoTerminado = true;
        detenerTemporizador();
        // Ocultar quiz y mostrar resultados con el tiempo agotado
        quizSection.classList.add('hidden');
        resultSection.classList.remove('hidden');

        const nota = aciertos;
        finalScoreValue.textContent = `${nota}/${TOTAL_PREGUNTAS}`;
        finalMessage.textContent = `⏰ ¡Tiempo agotado! Conseguiste ${nota} aciertos. ¡Sigue practicando!`;
      }

      function mostrarResultadosFinales() {
        if (juegoTerminado) return;
        juegoTerminado = true;
        detenerTemporizador();
        quizSection.classList.add('hidden');
        resultSection.classList.remove('hidden');

        const nota = aciertos;
        finalScoreValue.textContent = `${nota}/${TOTAL_PREGUNTAS}`;

        let mensaje = '';
        if (nota === TOTAL_PREGUNTAS) mensaje = '¡Perfecto! Eres una leyenda del madridismo. ⚽👑';
        else if (nota >= 16) mensaje = '¡Excelente! Tienes un gran conocimiento del Real Madrid.';
        else if (nota >= 12) mensaje = 'Buen resultado. Sabes bastante, pero puedes mejorar.';
        else if (nota >= 8) mensaje = 'No está mal, pero repasa la historia del club.';
        else mensaje = 'Necesitas estudiar más sobre el Real Madrid. ¡Ánimo!';

        finalMessage.textContent = mensaje;
      }

      // ----------------------------------------------------------------
      // EVENTOS
      // ----------------------------------------------------------------
      restartBtn.addEventListener('click', () => {
        reiniciarJuego();
      });

      restartFromResult.addEventListener('click', () => {
        reiniciarJuego();
      });

      // Iniciar juego al cargar
      reiniciarJuego();

    })();
  </script>
</body>
